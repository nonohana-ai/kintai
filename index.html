<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タイムカード">
<meta name="theme-color" content="#1f4e79">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<title>タイムカード（野の花）</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1f2328; --sub:#5f6b7a; --line:#d8dde4; --pri:#1f4e79; --pri2:#e8f0f8; --ok:#1f7a45; --okbg:#e3f4ea; --warn:#9a5b00; --warnbg:#fff3dc; --ng:#a11d1d; --ngbg:#fde8e8; --in:#1f7a45; --out:#b4410f; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; font-size:16px; -webkit-text-size-adjust:100%; }
  header { background:var(--pri); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:18px; flex:1; }
  header .who { font-size:13px; opacity:.9; text-align:right; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:6px 10px; font-size:13px; }
  nav.tabs { display:flex; gap:4px; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); padding:0 8px; position:sticky; top:0; z-index:5; }
  nav.tabs button { flex:0 0 auto; border:0; background:none; padding:12px 12px; font-size:15px; color:var(--sub); border-bottom:3px solid transparent; }
  nav.tabs button.on { color:var(--pri); border-bottom-color:var(--pri); font-weight:700; }
  nav.tabs .badge { display:inline-block; min-width:18px; padding:0 5px; margin-left:4px; border-radius:9px; background:var(--ng); color:#fff; font-size:12px; line-height:18px; text-align:center; }
  main { max-width:560px; margin:0 auto; padding:14px 16px 60px; }
  main.wide { max-width:1200px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h2 { margin:0 0 10px; font-size:16px; }
  .muted { color:var(--sub); font-size:14px; }
  .small { font-size:13px; }
  label.f { display:block; font-size:14px; color:var(--sub); margin:12px 0 6px; }
  input, select, textarea { font:inherit; font-size:17px; width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea { min-height:64px; }
  button { font:inherit; cursor:pointer; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 14px; font-size:15px; color:var(--ink); }
  .btn.pri { background:var(--pri); border-color:var(--pri); color:#fff; }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.ng { background:#fff; border-color:var(--ng); color:var(--ng); }
  .btn.sm { padding:6px 10px; font-size:13px; }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:1; }
  .row > .btn { flex:0 0 auto; white-space:nowrap; }
  .big { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .big button { border:0; border-radius:16px; padding:26px 0; font-size:26px; font-weight:700; color:#fff; }
  .big .in { background:var(--in); }
  .big .out { background:var(--out); }
  .clock { text-align:center; font-size:40px; font-weight:700; letter-spacing:1px; margin:4px 0; font-variant-numeric:tabular-nums; }
  .shift { background:var(--pri2); border-radius:10px; padding:10px 12px; margin-top:8px; }
  .shift b { font-size:18px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; background:#eef1f5; color:var(--sub); margin:1px 2px; }
  .pill.ok { background:var(--okbg); color:var(--ok); } .pill.warn { background:var(--warnbg); color:var(--warn); } .pill.ng { background:var(--ngbg); color:var(--ng); } .pill.pri { background:var(--pri2); color:var(--pri); }
  .msg { padding:10px 12px; border-radius:10px; margin:8px 0; font-size:15px; }
  .msg.ok { background:var(--okbg); color:var(--ok); } .msg.ng { background:var(--ngbg); color:var(--ng); } .msg.warn { background:var(--warnbg); color:var(--warn); }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 6px; text-align:left; vertical-align:top; }
  th { background:#f2f4f7; font-weight:600; position:sticky; top:0; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.sun td.d { color:var(--ng); } tr.sat td.d { color:#1d4ed8; } tr.wk td { background:#f7f9fb; font-weight:600; }
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .grid { border-collapse:separate; border-spacing:0; font-size:13px; }
  .grid th, .grid td { border-right:1px solid var(--line); text-align:center; padding:4px 2px; min-width:34px; }
  .grid td.name, .grid th.name { position:sticky; left:0; background:#fff; z-index:2; text-align:left; min-width:96px; padding:4px 6px; }
  .grid th.name { background:#f2f4f7; z-index:3; }
  .grid td.cell { cursor:pointer; font-weight:600; }
  .grid td.cell.edited { outline:2px solid var(--warn); outline-offset:-2px; }
  .grid td.legal { box-shadow:inset 0 -3px 0 #d97706; }
  .grid th.sun { color:var(--ng); } .grid th.sat { color:#1d4ed8; } .grid th.hol { color:var(--ng); background:#fff1f1; }
  .grid tr.err td.name { background:var(--ngbg); }
  .list .item { border-bottom:1px solid var(--line); padding:10px 0; }
  .list .item:last-child { border-bottom:0; }
  dialog { border:0; border-radius:14px; padding:0; width:min(520px,94vw); box-shadow:0 10px 40px rgba(0,0,0,.25); }
  dialog .in { padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .sumgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:6px; }
  .sumgrid div { background:#f2f4f7; border-radius:8px; padding:6px 8px; }
  .sumgrid .k { font-size:12px; color:var(--sub); } .sumgrid .v { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
  .loading { position:fixed; inset:0; background:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:center; z-index:50; font-size:15px; color:var(--sub); }
  @media print { header, nav.tabs, .noprint { display:none !important; } main { max-width:none; padding:0; } .card { border:0; } }
tr.timee td{background:#f6f3ff}
</style>
</head>
<body>
<header>
  <h1 id="ttl">タイムカード</h1>
  <div class="who" id="who"></div>
  <button id="logoutBtn" hidden>ログアウト</button>
</header>
<nav class="tabs" id="tabs" hidden></nav>
<main id="main"></main>
<div class="loading" id="loading" hidden>読み込み中…</div>
<dialog id="dlg"><div class="in" id="dlgBody"></div></dialog>

<script>
var API = 'https://script.google.com/macros/s/AKfycbzgLBL3clusuTftlQrCeKx85YCwWGI9UMYarYm87eB6q1qwg_IE8Q8kQIpzQ1JYKYdNaA/exec';
var S = { token: null, staff: null, shared: null, tab: 'punch', cache: {} };
var DOW = ['日', '月', '火', '水', '木', '金', '土'];
var LEAVE_KINDS = ['公休', '振替休日', '代休', '有休（全日）', '有休（午前半休）', '有休（午後半休）', '欠勤', '特別休暇', '労災休業', '産前産後休業', '育児休業', '介護休業', '会社都合の休業'];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function hm(min) { min = Number(min) || 0; if (!min) return ''; var neg = min < 0; min = Math.abs(min); return (neg ? '-' : '') + Math.floor(min / 60) + ':' + ('0' + (min % 60)).slice(-2); }
function hm0(min) { return hm(min) || '0:00'; }
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function today() { var d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); }
function monthKeyOf(ymd) { var y = +ymd.slice(0, 4), m = +ymd.slice(5, 7), d = +ymd.slice(8); if (d > 15) { m++; if (m === 13) { m = 1; y++; } } return y + '-' + ('0' + m).slice(-2); }
function shiftMonth(key, n) { var y = +key.slice(0, 4), m = +key.slice(5) + n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + ('0' + m).slice(-2); }
function monthLabel(key) { return +key.slice(5) + '月分（' + rangeOf(key).from.slice(5).replace('-', '/') + '〜' + rangeOf(key).to.slice(5).replace('-', '/') + '）'; }
function rangeOf(key) { var y = +key.slice(0, 4), m = +key.slice(5); var pm = m - 1, py = y; if (!pm) { pm = 12; py--; } return { from: py + '-' + ('0' + pm).slice(-2) + '-16', to: y + '-' + ('0' + m).slice(-2) + '-15' }; }

function call(action, data, quiet) {
  data = data || {}; data.action = action; if (S.token) data.token = S.token;
  if (!quiet) $('loading').hidden = false;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) })
    .then(function (r) { return r.json(); })
    .catch(function () { return { error: '通信できませんでした。電波のよいところでもう一度ためしてください' }; })
    .then(function (res) {
      $('loading').hidden = true;
      if (res && res.needLogin && action !== 'login') { S.token = null; store('kintai-token', null); showLogin('ログインし直してください'); }
      return res || {};
    });
}

// ── 起動 ──
(function boot() {
  var q = new URLSearchParams(location.search);
  if (q.get('shared')) { store('kintai-shared', q.get('shared')); history.replaceState(null, '', location.pathname); }
  S.shared = load('kintai-shared');
  if (!API || API.indexOf('__') === 0) { $('main').innerHTML = '<div class="card msg ng">まだ公開の準備中です（受け取り口の URL が入っていません）。</div>'; return; }
  if (S.shared) return sharedMode();
  S.token = load('kintai-token');
  if (!S.token) return showLogin();
  call('me').then(function (r) { if (r.ok) { S.staff = r.staff; S.me = r; startApp(); } else if (!r.needLogin) showLogin(r.error); });
})();

function showLogin(msg) {
  $('tabs').hidden = true; $('logoutBtn').hidden = true; $('who').textContent = '';
  $('main').className = '';
  $('main').innerHTML = '<div class="card"><h2>ログイン</h2>' + (msg ? '<div class="msg warn">' + esc(msg) + '</div>' : '') +
    '<label class="f">職員ID</label><input id="lid" autocomplete="username" autocapitalize="characters" placeholder="例 K005">' +
    '<label class="f">暗証番号</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password">' +
    '<p><button class="btn pri" id="lbtn" style="width:100%">ログイン</button></p><p class="muted small">一度ログインすると30日間はそのまま使えます。暗証番号を忘れたら管理者に聞いてください。</p></div>';
  $('lbtn').onclick = function () {
    call('login', { id: $('lid').value.trim(), pin: $('lpin').value.trim(), device: navigator.userAgent.slice(0, 60) }).then(function (r) {
      if (!r.ok) return showLogin(r.error);
      S.token = r.token; store('kintai-token', r.token); S.staff = r.staff;
      call('me').then(function (m) { S.me = m; startApp(); });
    });
  };
}
function startApp() {
  $('who').innerHTML = esc(S.staff.name) + '<br><span class="small">' + esc(S.staff.role) + '</span>';
  $('logoutBtn').hidden = false;
  $('logoutBtn').onclick = function () { if (!window.confirm || true) { call('logout').then(function () { store('kintai-token', null); S.token = null; showLogin(); }); } };
  var tabs = [['punch', '打刻'], ['card', 'タイムカード'], ['req', '申請'], ['leave', '有休'], ['note', 'お知らせ']];
  if (S.staff.role !== '職員') tabs = tabs.concat([['today', '今日'], ['pend', '承認待ち'], ['sched', 'スケジュール表'], ['month', '月の集計'], ['leaveAdm', '有休管理']]);
  if (S.staff.role === '管理者') tabs.push(['set', '設定']);
  $('tabs').innerHTML = tabs.map(function (t) { return '<button data-t="' + t[0] + '">' + t[1] + (t[0] === 'note' && S.me && S.me.unread ? '<span class="badge">' + S.me.unread + '</span>' : '') + '<span class="badge" id="b-' + t[0] + '" hidden></span></button>'; }).join('');
  $('tabs').hidden = false;
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.onclick = function () { go(b.getAttribute('data-t')); }; });
  go(load('kintai-tab') && tabs.some(function (t) { return t[0] === load('kintai-tab'); }) ? load('kintai-tab') : 'punch');
  if (S.staff.role !== '職員') call('pending', {}, true).then(function (p) { var n = p.ok ? p.items.length + p.requests.length + p.weekErrors.length : 0; var b = $('b-pend'); if (b && n) { b.hidden = false; b.textContent = n; } });
}
function go(t) {
  S.tab = t; store('kintai-tab', t);
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
  $('main').className = ['sched', 'month', 'today', 'leaveAdm', 'set', 'pend'].indexOf(t) >= 0 ? 'wide' : '';
  ({ punch: viewPunch, card: viewCard, req: viewReq, leave: viewLeave, note: viewNote, today: viewToday, pend: viewPend, sched: viewSched, month: viewMonth, leaveAdm: viewLeaveAdm, set: viewSet })[t]();
}

// ── 打刻 ──
var clockTimer = null;
function tickClock() { var el = $('clk'); if (!el) return; var d = new Date(Date.now() + 9 * 3600e3); el.textContent = d.toISOString().slice(11, 19); }
function viewPunch(msg) {
  call('me', {}, !!msg).then(function (m) {
    if (!m.ok) return;
    S.me = m;
    var cur = m.current, nx = m.next;
    var html = '<div class="card"><div class="clock" id="clk"></div><div class="muted" style="text-align:center">' + esc(m.now.slice(0, 10)) + '</div>' + (msg || '');
    if (cur) html += '<div class="shift">勤務中：<b>' + esc(cur.pattern) + '</b> ' + esc(cur.start || '') + (cur.end ? '〜' + esc(cur.end) : '') + '<br><span class="small">出勤 ' + esc(cur.in) + (cur.site ? '（' + esc(cur.site) + '）' : '') + '</span></div>';
    else if (nx) html += '<div class="shift">次の勤務：<b>' + esc(nx.pattern) + '</b> ' + esc(nx.date.slice(5).replace('-', '/')) + ' ' + esc(nx.start) + '〜' + esc(nx.end) + '<br><span class="small">' + esc(nx.site) + '</span></div>';
    else html += '<div class="shift">今日の勤務の予定はありません</div>';
    html += '<div class="big"><button class="in" id="pIn">出勤</button><button class="out" id="pOut">退勤</button></div>';
    html += '<p class="muted small">押すと今の場所を1回だけ記録します（勤怠の確認のため）。場所が取れなくても打刻はできます。</p></div>';
    html += '<div class="card"><div class="row"><div>有休の残り<br><b style="font-size:20px">' + (m.leave.left || 0) + '日</b></div>' +
      (m.leave.expiringIn30 ? '<div class="small" style="color:var(--warn)">30日以内に ' + m.leave.expiringIn30 + '日 消えます</div>' : '<div></div>') + '</div></div>';
    $('main').innerHTML = html;
    clearInterval(clockTimer); tickClock(); clockTimer = setInterval(tickClock, 1000);
    $('pIn').onclick = function () { doPunch('出勤'); };
    $('pOut').onclick = function () { doPunch('退勤'); };
  });
}
function getPos() {
  return new Promise(function (ok) {
    if (!navigator.geolocation) return ok({ gpsStatus: '取得失敗' });
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; ok({ gpsStatus: '取得失敗' }); } }, 12000);
    navigator.geolocation.getCurrentPosition(function (p) { if (done) return; done = true; clearTimeout(t); ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }); },
      function (e) { if (done) return; done = true; clearTimeout(t); ok({ gpsStatus: e.code === 1 ? '拒否' : '取得失敗' }); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
  });
}
function doPunch(kind) {
  ['pIn', 'pOut'].forEach(function (id) { if ($(id)) $(id).disabled = true; });
  $('loading').hidden = false; $('loading').textContent = '場所を確かめています…';
  getPos().then(function (g) {
    $('loading').textContent = '読み込み中…';
    g.kind = kind; g.deviceTime = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 16);
    return call('punch', g);
  }).then(function (r) {
    if (!r.ok) return viewPunch('<div class="msg ng">' + esc(r.error) + '</div>');
    var gp = r.gps.status === '取得OK' ? (r.gps.inRange === 'いいえ' ? '（場所が事業所の外でした。あとで確認があります）' : r.gps.site ? '（' + r.gps.site + '）' : '') : r.gps.status === '共用端末' ? '' : '（場所が取れませんでした）';
    viewPunch('<div class="msg ok">' + esc(kind) + 'を打刻しました ' + esc(r.time) + ' ' + esc(gp) + '</div>');
  });
}

// ── 共用端末（ホームのタブレット） ──
function sharedMode() {
  call('sharedInfo', { key: S.shared }).then(function (r) {
    $('ttl').textContent = 'タイムカード（共用）';
    if (!r.ok) { $('main').innerHTML = '<div class="card msg ng">' + esc(r.error) + '</div><p><button class="btn" onclick="localStorage.removeItem(\'kintai-shared\');location.reload()">共用端末をやめる</button></p>'; return; }
    $('who').textContent = r.site;
    var draw = function (msg) {
      $('main').innerHTML = '<div class="card"><div class="clock" id="clk"></div>' + (msg || '') + '<label class="f">職員ID</label><input id="sid" autocapitalize="characters"><label class="f">暗証番号</label><input id="spin" type="password" inputmode="numeric">' +
        '<div class="big"><button class="in" id="pIn">出勤</button><button class="out" id="pOut">退勤</button></div><p class="muted small">' + esc(r.site) + 'の共用端末です。打刻したら番号は消えます。</p></div>';
      clearInterval(clockTimer); tickClock(); clockTimer = setInterval(tickClock, 1000);
      function p(kind) { call('sharedPunch', { key: S.shared, id: $('sid').value.trim(), pin: $('spin').value.trim(), kind: kind }).then(function (x) { draw(x.ok ? '<div class="msg ok">' + esc(kind) + 'を打刻しました ' + esc(x.time) + '</div>' : '<div class="msg ng">' + esc(x.error) + '</div>'); }); }
      $('pIn').onclick = function () { p('出勤'); }; $('pOut').onclick = function () { p('退勤'); };
    };
    draw();
  });
}

// ── タイムカード ──
function monthNav(key, onChange) {
  return '<div class="row noprint" style="margin-bottom:10px"><button class="btn sm" id="mPrev" style="flex:0">◀</button><div style="text-align:center;font-weight:700">' + esc(monthLabel(key)) + '</div><button class="btn sm" id="mNext" style="flex:0">▶</button></div>';
}
function bindMonthNav(key, fn) { $('mPrev').onclick = function () { fn(shiftMonth(key, -1)); }; $('mNext').onclick = function () { fn(shiftMonth(key, 1)); }; }
function viewCard(month, staffId) {
  month = month || S.me.month || monthKeyOf(today());
  var act = staffId ? 'timecardOf' : 'timecard';
  call(act, { month: month, staffId: staffId }).then(function (r) {
    if (!r.ok) { $('main').innerHTML = '<div class="msg ng">' + esc(r.error) + '</div>'; return; }
    var sm = r.summary || {};
    var html = '<div class="card">' + monthNav(month) + (staffId ? '<h2>' + esc(r.staff.name) + '（' + esc(r.staff.id) + '）</h2>' : '') + (r.closed ? '<span class="pill ok">締め済み</span>' : '') +
      '<div class="sumgrid" style="margin-top:8px">' + [['実働合計', hm0(sm['実働合計'])], ['所定', hm0(sm['所定'])], ['所定外', hm0(sm['所定外'])], ['時間外', hm0(sm['時間外'])], ['60時間超', hm0(sm['60時間超'])], ['深夜', hm0(sm['深夜'])], ['法定休日', hm0(sm['法定休日'])], ['遅刻・早退', hm0((+sm['遅刻'] || 0) + (+sm['早退'] || 0))], ['出勤日数', (sm['出勤日数'] || 0) + '日'], ['有休', (sm['有休日数'] || 0) + '日']].map(function (x) { return '<div><div class="k">' + x[0] + '</div><div class="v">' + x[1] + '</div></div>'; }).join('') + '</div>' +

    html += '<div class="card"><h2>1. APIトークン</h2>' + (msg || '') +
      (r.set ? '<div class="msg ok">設定済み：' + esc(r.account) + ' のアカウントから送ります</div>' : '<div class="msg warn">まだ入っていません。入れるまで、通知はタイムカード画面の「お知らせ」にだけ出ます。</div>') +
      '<p class="small muted">チャットワークにログイン → 右上の名前 →「サービス連携」→「APIトークン」で表示されたトークンを貼り付けます。通知はこのアカウントから送られます。トークンはGASの中にだけ保存し、画面には二度と出しません。</p>' +
      '<div class="row"><input id="cwTok" type="password" autocomplete="off" placeholder="APIトークンを貼り付け"><button class="btn pri" id="cwSave">保存</button></div></div>';
    if (r.set) {
      html += '<div class="card"><h2>2. 送り先</h2>' + (r.roomsError ? '<div class="msg ng">' + esc(r.roomsError) + '</div>' : '') +
        '<p class="small muted">トークンのアカウントの「マイチャット」と「ダイレクトチャット」から選びます。トークンのアカウント本人にはマイチャット、ほかの人にはその人とのダイレクトチャットを選んでください（グループチャットは出しません）。</p>' +
        '<table><tr><th>名前</th><th>権限</th><th>送り先</th><th></th></tr>' + r.staff.map(function (s) {
          return '<tr><td>' + esc(s.name) + '</td><td>' + esc(s.role) + '</td><td><select data-room="' + esc(s.id) + '"><option value="">（送らない）</option>' + r.rooms.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === s.room ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></td><td><button class="btn sm" data-test="' + esc(s.id) + '"' + (s.room ? '' : ' disabled') + '>テスト送信</button></td></tr>';
        }).join('') + '</table><p class="small muted">職員にもチャットワークで送りたいときは、「設定」→「職員」でその人の「チャットワークのルームID」を入れると、ここに出ます。</p></div>';
    }
    $('main').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-st]'), function (b) { b.onclick = function () { viewSet(+b.dataset.st); }; });
    $('cwSave').onclick = function () { var t = $('cwTok').value.trim(); if (!t) return; call('cwTokenSet', { token2: t }).then(function (x) { viewCw(x.ok ? '<div class="msg ok">保存しました（' + esc(x.account || '') + '）</div>' : '<div class="msg ng">' + esc(x.error) + '</div>'); }); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-room]'), function (sel) { sel.onchange = function () { call('cwRoomSet', { staffId: sel.dataset.room, roomId: sel.value }).then(function (x) { viewCw(x.ok ? '<div class="msg ok">送り先を保存しました</div>' : '<div class="msg ng">' + esc(x.error) + '</div>'); }); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-test]'), function (b) { b.onclick = function () { call('cwTest', { staffId: b.dataset.test }).then(function (x) { viewCw(x.ok ? '<div class="msg ok">テストを送りました。チャットワークを見てください</div>' : '<div class="msg ng">' + esc(x.error) + '</div>'); }); }; });
  });
}
</script>
</body>
</html>
